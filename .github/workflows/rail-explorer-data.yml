name: Refresh rail-explorer data

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest ticket data
        run: python3 scripts/fetch_tickets.py

      - name: Sanity-check ticket count
        id: ticket_count_check
        run: python3 scripts/check_ticket_count.py

      - name: Discard bad ticket data and alert
        if: steps.ticket_count_check.outputs.significant == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git checkout -- data/tickets_raw.json
          NEW="${{ steps.ticket_count_check.outputs.new_count }}"
          OLD="${{ steps.ticket_count_check.outputs.old_count }}"
          PCT="${{ steps.ticket_count_check.outputs.drop_pct }}"
          TITLE="fetch_tickets.py: ticket count dropped significantly"
          BODY=$(printf 'The latest scrape returned %s tickets, down from %s (a %s%% drop, exceeding the 10%% threshold). `data/tickets_raw.json` and the `index.html` rebuild for this run were discarded to avoid publishing broken data.\n\nThis usually means National Rail changed the ranger-rover listing page or its pagination -- see the 2026-08 outage where a site redesign broke scraping silently for a month. Run `python3 scripts/fetch_tickets.py` locally and compare its output against the committed `data/tickets_raw.json` to diagnose.\n' "$NEW" "$OLD" "$PCT")
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open; adding a comment instead of a duplicate."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Fetch latest station coordinates
        run: python3 scripts/fetch_coords.py

      - name: Commit ticket/coords data refresh
        run: |
          set -e
          if ! git diff --quiet -- data/tickets_raw.json data/coords.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/tickets_raw.json data/coords.json
            git commit -m "Refresh ticket and station data ($(date -u +%Y-%m-%d))"
            git push origin main
          fi

      - name: Download RSP fares data feed
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
          OUTPUT_FILE: data/fares.zip
        run: ./scripts/download_fares.sh

      - name: Extract fares feed
        run: unzip -o data/fares.zip -d data/fares

      - name: Refresh rover/ranger pricing
        env:
          ROVER_WARNINGS_FILE: /tmp/rover_warnings.txt
        run: python3 scripts/fetch_rover_prices.py

      - name: Open issue for tracked ticket warnings
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WARNINGS_FILE=/tmp/rover_warnings.txt
          if [ ! -s "$WARNINGS_FILE" ]; then
            echo "No tracked-ticket warnings, nothing to do."
            exit 0
          fi
          TITLE="Tracked rover/ranger ticket(s) may need removing from overrides.json"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open; adding a comment instead of a duplicate."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$WARNINGS_FILE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$WARNINGS_FILE"
          fi

      - name: Commit pricing data refresh
        run: |
          set -e
          if ! git diff --quiet -- data/rover_prices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/rover_prices.json
            git commit -m "Refresh rover/ranger pricing from RSP fares feed ($(date -u +%Y-%m-%d))"
            git push origin main
          fi

      - name: Rebuild index.html
        run: python3 scripts/build_html.py

      - name: Commit index.html rebuild
        run: |
          set -e
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild index.html from refreshed data ($(date -u +%Y-%m-%d))"
            git push origin main
          fi

      - name: Download CIF timetable feed
        working-directory: rail-explorer
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
        run: python3 scripts/download_timetable.py

      - name: Import ticket/station data from rail-rover
        working-directory: rail-explorer
        run: python3 scripts/import_rail_data.py

      - name: Match stations to CRS codes
        working-directory: rail-explorer
        run: python3 scripts/match_stations.py

      - name: Build timetable database
        working-directory: rail-explorer
        run: python3 scripts/build_timetable_db.py

      - name: Export compact client-side dataset
        working-directory: rail-explorer
        run: python3 scripts/export_dataset.py

      - name: Publish to rail-explorer-data branch
        working-directory: rail-explorer
        run: |
          set -e
          OUT=$(mktemp -d)
          cp data/tickets.json data/coords.json data/station_crs.json data/timetable_export.json.gz "$OUT/"
          printf '{"generated": "%s"}\n' "$(date -u +%Y-%m-%d)" > "$OUT/meta.json"
          cd "$OUT"
          git init -q -b rail-explorer-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Refresh rail-explorer dataset ($(date -u +%Y-%m-%d))"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin rail-explorer-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
